# CDH集群部署系统 Docker Compose配置
# author: RaynLiu
# email: liuyu1_j6go@stu.cqie.edu.cn
# date: 2025-11-12
#
# 功能说明：
# 此配置文件用于编排CDH集群部署的Docker容器环境
# 包含控制节点和可选的测试节点

version: '3.8'

# ==========================================
# 服务定义
# ==========================================
services:
  # 控制节点 - 用于执行Ansible部署
  cdh-control:
    build:
      context: .
      dockerfile: Dockerfile
    image: cdh-deploy:latest
    container_name: cdh-control-node
    hostname: cdh-control
    
    # 环境变量
    env_file:
      - .env
    
    environment:
      - TZ=Asia/Shanghai
      - LANG=en_US.UTF-8
      - PROJECT_DIR=/root/setup_cdh_cluster
    
    # 卷挂载
    volumes:
      # 项目目录（开发时可以实时更新）
      - ./:/root/setup_cdh_cluster
      # SSH密钥持久化
      - ssh-keys:/root/.ssh
      # 日志持久化
      - logs:/var/log
      # 备份持久化
      - backups:/opt/backup
    
    # 网络配置
    networks:
      - cdh-network
    
    # 端口映射
    ports:
      - "2222:22"  # SSH端口
    
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    
    # 重启策略
    restart: unless-stopped
    
    # 健康检查
    healthcheck:
      test: ["CMD", "ansible", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # 启动命令
    command: /bin/bash -c "tail -f /dev/null"
    
    # 标签
    labels:
      com.cdh.role: "control"
      com.cdh.author: "RaynLiu"
      com.cdh.email: "liuyu1_j6go@stu.cqie.edu.cn"

  # 可选：测试节点（用于本地测试，生产环境使用真实虚拟机）
  # cdh-node01:
  #   image: centos:7
  #   container_name: cdh-node01
  #   hostname: node01
  #   networks:
  #     cdh-network:
  #       ipv4_address: 172.20.0.11
  #   volumes:
  #     - node01-data:/data
  #   restart: unless-stopped
  #   command: /usr/sbin/init

# ==========================================
# 网络定义
# ==========================================
networks:
  cdh-network:
    name: cdh-cluster-network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
    labels:
      com.cdh.network: "cluster"

# ==========================================
# 卷定义
# ==========================================
volumes:
  # SSH密钥持久化
  ssh-keys:
    name: cdh-ssh-keys
    driver: local
    labels:
      com.cdh.volume: "ssh"
  
  # 日志持久化
  logs:
    name: cdh-logs
    driver: local
    labels:
      com.cdh.volume: "logs"
  
  # 备份持久化
  backups:
    name: cdh-backups
    driver: local
    labels:
      com.cdh.volume: "backups"
  
  # 节点数据（可选）
  # node01-data:
  #   name: cdh-node01-data
  #   driver: local

# ==========================================
# 使用说明
# ==========================================
# 
# 1. 启动服务：
#    docker-compose up -d
#
# 2. 查看日志：
#    docker-compose logs -f cdh-control
#
# 3. 进入容器：
#    docker-compose exec cdh-control bash
#
# 4. 执行部署：
#    docker-compose exec cdh-control make deploy
#
# 5. 停止服务：
#    docker-compose down
#
# 6. 清理所有数据：
#    docker-compose down -v
#
# 7. 重建镜像：
#    docker-compose build --no-cache
#
# ==========================================
