  # 设置用户权限（仅在密码验证成功时执行）
  - name: 开放 scm 库下所有表的权限给 scm 用户
    mysql_user:
      login_user: root
      login_password: "{{password.mysql}}"
      name: scm
      password: "{{password.scm}}"
      priv: 'scm.*:ALL'
      host: '%'
      state: present
    when: mysql_final_check.rc == 0

  - name: 开放 amon 库下所有表的权限给 amon 用户
    mysql_user:
      login_user: root
