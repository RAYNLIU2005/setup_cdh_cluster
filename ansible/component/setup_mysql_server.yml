  # 构建 CDH 集群组件数据库（仅在密码验证成功时执行）
  - name: 创建 scm 数据库
    mysql_db:
      login_user: root
      login_password: "{{password.mysql}}"
      name: scm
      encoding: utf8
      state: present
    when: mysql_final_check.rc == 0

  - name: 创建 amon 数据库
    mysql_db:
      login_user: root
      login_password: "{{password.mysql}}"
      name: amon
      encoding: utf8
