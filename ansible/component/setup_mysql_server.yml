---
# 运行样例：ansible-playbook /opt/auto-deployment/setup_cdh_cluster/ansible/deploy_cdh.yml
# author: Jesse.liu
# date: 2020-07-18
# function: 自动部署 mysql server & client
# CDH 官方 mysql 安装指南：https://docs.cloudera.com/documentation/enterprise/6/6.3/topics/cm_ig_mysql.html

  - name: 卸载可能与 mysql 冲突的包
    yum:
      name: '{{item}}'
      state: absent
    loop:
      - 'mariadb-libs'

  - name: 安装 mysql 及其依赖
    yum:
      name: '{{paths.package}}/{{item}}'
      state: present
      disablerepo: epel,cloudera_setup_cdh
    loop:
      - 'mysql-community-common-5.7.30-1.el7.x86_64.rpm'
      - 'mysql-community-libs-5.7.30-1.el7.x86_64.rpm'
      - 'mysql-community-libs-compat-5.7.30-1.el7.x86_64.rpm'
      - 'mysql-community-devel-5.7.30-1.el7.x86_64.rpm'
      - 'mysql-community-embedded-5.7.30-1.el7.x86_64.rpm'
      - 'mysql-community-embedded-compat-5.7.30-1.el7.x86_64.rpm'
      - 'mysql-community-embedded-devel-5.7.30-1.el7.x86_64.rpm'
      - 'mysql-community-client-5.7.30-1.el7.x86_64.rpm'
      - 'mysql-community-server-5.7.30-1.el7.x86_64.rpm'


  - name: 启动 mysql server 并设置开机自启动
    service:
      name: mysqld
      state: started
      enabled: yes

  - name: 删除 /var/lib/mysql/ib_logfile0
    file:
      path: '/var/lib/mysql/ib_logfile0'
      state: absent

  - name: 删除 /var/lib/mysql/ib_logfile1
    file:
      path: '/var/lib/mysql/ib_logfile1'
      state: absent

  # 备份 /etc/my.cnf
  - name: 判断 /etc/my.cnf 是否存在
    stat:
      path: /etc/my.cnf
    register: mysql_config

  - name: 备份 /etc/my.cnf
    command: mv /etc/my.cnf /etc/my_bak.cnf
    when: mysql_config.stat.exists

  # 复制新 my.cnf 到 /etc 下
  - name: 复制新 my.cnf 到 /etc 下
    command: mv '{{paths.package}}/my.cnf' /etc/

  - name: 修改 /etc/my.cnf 权限为 644
    file:
      path: /etc/my.cnf
      mode: '0644'


  - name: 检查 MySQL 密码是否已设置为目标密码
    shell: mysql -uroot -p'{{password.mysql}}' -e "SELECT 'OK'" 2>&1
    register: mysql_check
    ignore_errors: yes
    changed_when: false

  - name: 获取 MySQL 日志中的临时密码
    shell: "grep 'temporary password' /var/log/mysqld.log | tail -n 1 | grep -P 'root@localhost: .+' -o | sed 's/root@localhost: //g'"
    register: mysql_temp_pwd
    when: mysql_check.rc != 0
    ignore_errors: yes

  - name: 尝试使用初始密码 123456 设置新密码
    shell: mysql -uroot -p'123456' -e 'ALTER USER "root"@"localhost" IDENTIFIED BY "{{password.mysql}}"; FLUSH PRIVILEGES;' 2>&1
    when: mysql_check.rc != 0
    ignore_errors: yes
    register: mysql_pwd_set_initial

  - name: 尝试使用日志临时密码设置新密码
    shell: mysql -uroot -p'{{mysql_temp_pwd.stdout}}' --connect-expired-password -e 'ALTER USER "root"@"localhost" IDENTIFIED BY "{{password.mysql}}"; FLUSH PRIVILEGES;' 2>&1
    when: 
      - mysql_check.rc != 0
      - mysql_pwd_set_initial is defined and mysql_pwd_set_initial.rc != 0
      - mysql_temp_pwd.stdout != ""
    ignore_errors: yes
    register: mysql_pwd_set_temp

  - name: 尝试无密码方式设置新密码
    shell: mysql -uroot -e 'ALTER USER "root"@"localhost" IDENTIFIED BY "{{password.mysql}}"; FLUSH PRIVILEGES;' 2>&1
    when: 
      - mysql_check.rc != 0
      - mysql_pwd_set_initial is defined and mysql_pwd_set_initial.rc != 0
      - (mysql_pwd_set_temp is not defined or mysql_pwd_set_temp.rc != 0)
    ignore_errors: yes
    register: mysql_pwd_set_nopass

  - name: 验证最终密码
    shell: mysql -uroot -p'{{password.mysql}}' -e "SELECT 'SUCCESS' as status" 2>&1
    register: mysql_final_check
    ignore_errors: yes
    changed_when: false

  - name: 显示密码设置结果
    debug:
      msg: |
        MySQL 密码配置状态:
        {% if mysql_final_check.rc == 0 %}
        ✓ MySQL 密码设置成功！当前密码: {{password.mysql}}
        {% else %}
        ✗ MySQL 密码设置失败，需要手动修复
        请执行: cd /root/setup_cdh_cluster && make reset-mysql
        {% endif %}

  - name: 重启 mysql server 并确保开机自启动
    service:
      name: mysqld
      state: restarted
      enabled: yes
    when: mysql_final_check.rc == 0

  - name: 等待 MySQL 端口就绪（TCP 3306）
    wait_for:
      host: localhost
      port: 3306
      state: started
      delay: 2
      timeout: 30
    when: mysql_final_check.rc == 0

  - name: 验证 MySQL 服务完全可用
    shell: mysql -uroot -p'{{password.mysql}}' -e "SELECT 1" 2>&1
    register: mysql_ready_check
    retries: 5
    delay: 2
    until: mysql_ready_check.rc == 0
    when: mysql_final_check.rc == 0
    ignore_errors: no

  - name: 显示 MySQL 就绪状态
    debug:
      msg: |
        ==========================================
        ✓ MySQL 服务已完全就绪
        ==========================================
        密码: {{password.mysql}}
        端口: 3306
        状态: 可以安全启动依赖服务（如 CM Server）
    when: mysql_final_check.rc == 0

  - name: 创建密码设置失败提示文件
    copy:
      content: |
        ==========================================
          MySQL Root 密码设置失败
        ==========================================
        
        当前状态：无法使用密码 {{password.mysql}} 登录
        
        修复步骤：
        1. cd /root/setup_cdh_cluster
        2. make reset-mysql
        3. make deploy
        
        或手动修复：
        systemctl stop mysqld
        mysqld_safe --skip-grant-tables --skip-networking &
        sleep 5
        mysql -uroot -e "FLUSH PRIVILEGES; ALTER USER 'root'@'localhost' IDENTIFIED BY '{{password.mysql}}'; FLUSH PRIVILEGES;"
        pkill mysqld_safe
        systemctl start mysqld
        
        ==========================================
      dest: /tmp/mysql_password_fix_needed
    when: mysql_final_check.rc != 0

  - name: 停止部署流程（如果密码设置失败）
    fail:
      msg: "MySQL 密码设置失败！请运行 'make reset-mysql' 修复后重新部署"
    when: mysql_final_check.rc != 0

