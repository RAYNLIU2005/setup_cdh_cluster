---
# 运行样例：ansible-playbook /opt/auto-deployment/setup_cdh_cluster/ansible/deploy_cdh.yml
# author: Jesse.liu
# date: 2020-07-18
# function: 自动部署 mysql server & client
# CDH 官方 mysql 安装指南：https://docs.cloudera.com/documentation/enterprise/6/6.3/topics/cm_ig_mysql.html

  - name: 卸载可能与 mysql 冲突的包
    yum:
      name: '{{item}}'
      state: absent
    loop:
      - 'mariadb-libs'

  - name: 安装 mysql 及其依赖
    yum:
      name: '{{paths.package}}/{{item}}'
      state: present
      disablerepo: epel,cloudera_setup_cdh
    loop:
      - 'mysql-community-common-5.7.30-1.el7.x86_64.rpm'
      - 'mysql-community-libs-5.7.30-1.el7.x86_64.rpm'
      - 'mysql-community-libs-compat-5.7.30-1.el7.x86_64.rpm'
      - 'mysql-community-devel-5.7.30-1.el7.x86_64.rpm'
      - 'mysql-community-embedded-5.7.30-1.el7.x86_64.rpm'
      - 'mysql-community-embedded-compat-5.7.30-1.el7.x86_64.rpm'
      - 'mysql-community-embedded-devel-5.7.30-1.el7.x86_64.rpm'
      - 'mysql-community-client-5.7.30-1.el7.x86_64.rpm'
      - 'mysql-community-server-5.7.30-1.el7.x86_64.rpm'


  - name: 启动 mysql server 并设置开机自启动
    service:
      name: mysqld
      state: started
      enabled: yes

  - name: 删除 /var/lib/mysql/ib_logfile0
    file:
      path: '/var/lib/mysql/ib_logfile0'
      state: absent

  - name: 删除 /var/lib/mysql/ib_logfile1
    file:
      path: '/var/lib/mysql/ib_logfile1'
      state: absent

  # 备份 /etc/my.cnf
  - name: 判断 /etc/my.cnf 是否存在
    stat:
      path: /etc/my.cnf
    register: mysql_config

  - name: 备份 /etc/my.cnf
    command: mv /etc/my.cnf /etc/my_bak.cnf
    when: mysql_config.stat.exists

  # 复制新 my.cnf 到 /etc 下
  - name: 复制新 my.cnf 到 /etc 下
    command: mv '{{paths.package}}/my.cnf' /etc/

  - name: 修改 /etc/my.cnf 权限为 644
    file:
      path: /etc/my.cnf
      mode: '0644'


  - name: 检查 MySQL 密码是否已设置为目标密码
    shell: mysql -uroot -p'{{password.mysql}}' -e "SELECT 'PASSWORD_OK' as status" 2>&1
    register: mysql_check
    ignore_errors: yes
    changed_when: false

  - name: 显示密码检查结果
    debug:
      msg: "MySQL 密码检查: {% if mysql_check.rc == 0 %}密码已正确设置为 {{password.mysql}}{% else %}密码需要设置{% endif %}"

  - name: 获取 MySQL 日志中的临时密码
    shell: "grep 'temporary password' /var/log/mysqld.log 2>/dev/null | tail -n 1 | grep -P 'root@localhost: .+' -o | sed 's/root@localhost: //g' || echo ''"
    register: mysql_temp_pwd
    when: mysql_check.rc != 0
    changed_when: false

  - name: 尝试使用无密码方式设置（MySQL 初次安装）
    shell: |
      mysql -uroot <<EOF 2>&1
      SET GLOBAL validate_password_policy=LOW;
      SET GLOBAL validate_password_length=1;
      ALTER USER 'root'@'localhost' IDENTIFIED BY '{{password.mysql}}';
      FLUSH PRIVILEGES;
      EOF
    when: mysql_check.rc != 0
    ignore_errors: yes
    register: mysql_pwd_set_nopass

  - name: 尝试使用初始密码 123456 设置新密码
    shell: |
      mysql -uroot -p'123456' <<EOF 2>&1
      SET GLOBAL validate_password_policy=LOW;
      SET GLOBAL validate_password_length=1;
      ALTER USER 'root'@'localhost' IDENTIFIED BY '{{password.mysql}}';
      FLUSH PRIVILEGES;
      EOF
    when: 
      - mysql_check.rc != 0
      - mysql_pwd_set_nopass is defined and mysql_pwd_set_nopass.rc != 0
    ignore_errors: yes
    register: mysql_pwd_set_initial

  - name: 尝试使用日志临时密码设置新密码
    shell: |
      mysql -uroot -p'{{mysql_temp_pwd.stdout}}' --connect-expired-password <<EOF 2>&1
      SET GLOBAL validate_password_policy=LOW;
      SET GLOBAL validate_password_length=1;
      ALTER USER 'root'@'localhost' IDENTIFIED BY '{{password.mysql}}';
      FLUSH PRIVILEGES;
      EOF
    when: 
      - mysql_check.rc != 0
      - mysql_pwd_set_nopass is defined and mysql_pwd_set_nopass.rc != 0
      - mysql_pwd_set_initial is defined and mysql_pwd_set_initial.rc != 0
      - mysql_temp_pwd.stdout is defined and mysql_temp_pwd.stdout != ""
    ignore_errors: yes
    register: mysql_pwd_set_temp

  - name: 使用安全模式强制重置密码（最后手段）
    block:
      - name: 停止 MySQL 服务
        systemd:
          name: mysqld
          state: stopped
        
      - name: 清理残留进程
        shell: pkill -9 mysqld 2>/dev/null || true
        
      - name: 等待进程完全停止
        pause:
          seconds: 3
          
      - name: 启动安全模式
        shell: |
          mysqld_safe --skip-grant-tables --skip-networking >/dev/null 2>&1 &
          echo $! > /tmp/mysqld_safe.pid
        async: 10
        poll: 0
        
      - name: 等待 MySQL 安全模式启动
        pause:
          seconds: 8
          
      - name: 验证 MySQL 已启动
        shell: mysqladmin ping 2>/dev/null
        register: mysql_ping
        retries: 10
        delay: 1
        until: mysql_ping.rc == 0
        ignore_errors: yes
        
      - name: 重置密码
        shell: |
          mysql -uroot <<EOF
          FLUSH PRIVILEGES;
          ALTER USER 'root'@'localhost' IDENTIFIED BY '{{password.mysql}}';
          FLUSH PRIVILEGES;
          EOF
        register: reset_result
        
      - name: 停止安全模式
        shell: |
          if [ -f /tmp/mysqld_safe.pid ]; then
            kill $(cat /tmp/mysqld_safe.pid) 2>/dev/null || true
            rm -f /tmp/mysqld_safe.pid
          fi
          pkill -9 mysqld_safe 2>/dev/null || true
          pkill -9 mysqld 2>/dev/null || true
          
      - name: 等待进程完全停止
        pause:
          seconds: 3
          
      - name: 正常启动 MySQL
        systemd:
          name: mysqld
          state: started
          
      - name: 等待 MySQL 正常启动
        wait_for:
          host: localhost
          port: 3306
          state: started
          delay: 3
          timeout: 30
    
    when: 
      - mysql_check.rc != 0
      - mysql_pwd_set_nopass is defined and mysql_pwd_set_nopass.rc != 0
      - mysql_pwd_set_initial is defined and mysql_pwd_set_initial.rc != 0
      - (mysql_pwd_set_temp is not defined or mysql_pwd_set_temp.rc != 0)
    ignore_errors: no

  - name: 最终验证 MySQL 密码
    shell: mysql -uroot -p'{{password.mysql}}' -e "SELECT 'SUCCESS' as status" 2>&1
    register: mysql_final_check
    ignore_errors: yes
    changed_when: false

  - name: 显示密码设置结果
    debug:
      msg: |
        ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        MySQL 密码配置状态
        ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        {% if mysql_final_check.rc == 0 %}
        ✓ MySQL 密码设置成功！
        ✓ 当前密码: {{password.mysql}}
        ✓ 可以正常连接数据库
        {% else %}
        ✗ MySQL 密码设置失败
        ✗ 请手动执行: make reset-mysql
        ✗ 然后重新部署: make deploy
        {% endif %}
        ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  - name: 重启 mysql server 并确保开机自启动
    service:
      name: mysqld
      state: restarted
      enabled: yes

  - name: 等待 MySQL 端口就绪（TCP 3306）
    wait_for:
      host: localhost
      port: 3306
      state: started
      delay: 2
      timeout: 30
    when: mysql_final_check.rc == 0

  - name: 验证 MySQL 服务完全可用
    shell: mysql -uroot -p'{{password.mysql}}' -e "SELECT 1" 2>&1
    register: mysql_ready_check
    retries: 5
    delay: 2
    until: mysql_ready_check.rc == 0
    when: mysql_final_check.rc == 0
    ignore_errors: no

  - name: 显示 MySQL 就绪状态
    debug:
      msg: |
        ==========================================
        ✓ MySQL 服务已完全就绪
        ==========================================
        密码: {{password.mysql}}
        端口: 3306
        状态: 可以安全启动依赖服务（如 CM Server）
    when: mysql_final_check.rc == 0

  - name: 警告：MySQL 密码设置可能失败（但继续部署）
    debug:
      msg: |
        ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        ⚠️  警告：MySQL 密码验证失败
        ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        
        虽然密码设置尝试失败，但部署将继续进行。
        如果后续步骤失败，请执行以下操作：
        
        快速修复：
          cd /root/setup_cdh_cluster
          make reset-mysql
          make deploy
        
        手动修复：
          systemctl stop mysqld
          mysqld_safe --skip-grant-tables --skip-networking &
          sleep 5
          mysql -uroot -e "FLUSH PRIVILEGES; ALTER USER 'root'@'localhost' IDENTIFIED BY '123456'; FLUSH PRIVILEGES;"
          pkill mysqld_safe
          systemctl start mysqld
        
        ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    when: mysql_final_check.rc != 0

  - name: 创建密码修复提示文件
    copy:
      content: |
        MySQL 密码验证失败，但部署继续进行。
        如遇问题请执行: cd /root/setup_cdh_cluster && make reset-mysql && make deploy
      dest: /tmp/mysql_password_warning
    when: mysql_final_check.rc != 0

  # 构建 CDH 集群组件数据库
