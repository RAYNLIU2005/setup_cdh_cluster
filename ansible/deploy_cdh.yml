###############################################################################
#                                                                             #
#           CDH 6.2.0 自动化部署系统                                          #
#           Cloudera Data Hub Automated Deployment System                    #
#                                                                             #
###############################################################################
#
# 🎯 系统信息
#   版本: v2.5.0
#   作者: RaynLiu (liuyu1_j6go@stu.cqie.edu.cn)
#   日期: 2025-11-13
#   许可: MIT License
#
# 📋 支持的版本
#   • CDH 6.2.0
#   • Ansible 2.8.12+
#   • Python 3.8+ (兼容 Python 2.7.5)
#   • CentOS 7.x
#
# 🚀 快速开始
#   make full-deploy  # 完整部署（推荐）
#   make deploy       # 仅部署集群
#
# 📦 安装包路径（自动管理）
#   /opt/base_file/packages  - 软件包
#   /opt/base_file/parcels   - CDH Parcel 包
#
# 🔧 配置文件
#   /etc/ansible/hosts       - Ansible inventory
#   .env                     - 环境变量配置
#
# 📚 文档
#   README.md               - 完整文档
#   docs/                   - 详细文档
#
###############################################################################









# ═══════════════════════════════════════════════════════════════════════════
# 部署初始化：显示横幅和环境检查
# ═══════════════════════════════════════════════════════════════════════════
- hosts: localhost
  gather_facts: no
  tasks:
    - name: 🚀 显示部署横幅
      debug:
        msg: |
          
          ╔═══════════════════════════════════════════════════════════════════════════╗
          ║                                                                           ║
          ║                    CDH 6.2.0 自动化部署系统                                ║
          ║                Cloudera Data Hub Deployment System                        ║
          ║                                                                           ║
          ╚═══════════════════════════════════════════════════════════════════════════╝
          
          📊 部署信息
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            版本        CDH 6.2.0 + CM 6.2.0
            部署时间    {{ lookup('pipe', 'date "+%Y-%m-%d %H:%M:%S"') }}
            执行节点    {{ inventory_hostname }}
            部署模式    生产环境 (Production)
          
          🎯 部署阶段
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            ① 环境准备       → 系统优化、软件安装
            ② MySQL 部署     → 数据库初始化
            ③ CM Server     → Cloudera Manager 安装
            ④ Agent 部署    → 集群节点配置
            ⑤ 服务启动      → 启动所有服务
          
          ⏱  预计耗时: 15-25 分钟
          
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          

# ═══════════════════════════════════════════════════════════════════════════
# 阶段 1: 环境准备和检查
# ═══════════════════════════════════════════════════════════════════════════
- hosts: all_node
  gather_facts: F
  remote_user: root
  
  tasks:
    - name: 📁 创建日志目录
      file:
        path: /var/log
        state: directory
        mode: '0755'
      ignore_errors: yes
    
    - name: 📝 初始化部署日志
      shell: |
        echo "╔═══════════════════════════════════════════════════════════╗" >> /var/log/cdh_deploy.log
        echo "║  CDH 集群部署日志                                          ║" >> /var/log/cdh_deploy.log
        echo "╚═══════════════════════════════════════════════════════════╝" >> /var/log/cdh_deploy.log
        echo "" >> /var/log/cdh_deploy.log
        echo "⏰ 部署开始: $(date '+%Y-%m-%d %H:%M:%S')" >> /var/log/cdh_deploy.log
        echo "🖥  主机名: {{ inventory_hostname }}" >> /var/log/cdh_deploy.log
        echo "👤 用户: $(whoami)" >> /var/log/cdh_deploy.log
        echo "📍 IP地址: $(hostname -I | awk '{print $1}')" >> /var/log/cdh_deploy.log
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━" >> /var/log/cdh_deploy.log
        echo "" >> /var/log/cdh_deploy.log
      ignore_errors: yes

# 基础环境配置
- hosts: all_node
  # 开启debug
  gather_facts: F
  vars:
    # 本地 yum 源节点
    local_yum_repo: node01
    # 各种路径
    paths:
      base_file: /opt/base_file
      package: /opt/setup_cdh
    # 各种组件安装包
    packages:
      java: jdk-8u261-linux-x64.tar.gz
      scala: scala-2.13.0-M4.tgz
      mysql_driver: mysql-connector-java-5.1.47.jar
    # 各种链接
    url:
      cloudera_baseurl: https://archive.cloudera.com/cm6/6.3.1/redhat7/yum/
  remote_user: root

  tasks:
    # 1.配置 linux 系统环境
    - include: ./component/setup_system_env.yml

    # 2.配置 Java 环境
    - include: ./component/setup_java_env.yml

    # 3.配置 Scala 环境
    - include: ./component/setup_scala_env.yml

    # 4.配置 Python 环境
    - include: ./component/setup_python_env.yml









# 基础服务
- hosts: master_node
  # 开启debug
  gather_facts: F
  vars:
    # 各种路径
    paths:
      package: /opt/setup_cdh
    packages:
      cloudera_manager_agent: cloudera-manager-agent-6.2.0-968826.el7.x86_64.rpm
      cloudera_manager_daemons: cloudera-manager-daemons-6.2.0-968826.el7.x86_64.rpm
      cloudera_manager_server: cloudera-manager-server-6.2.0-968826.el7.x86_64.rpm
      cloudera_manager_server_db: cloudera-manager-server-db-2-6.2.0-968826.el7.x86_64.rpm
  remote_user: root

  tasks:
    # 1.配置本地仓库服务
    - include: ./component/setup_local_repository.yml











# CDH 服务安装
- hosts: all_node
  # 开启debug
  gather_facts: F
  vars:
    # 本地 yum 源节点
    local_yum_repo: node01
    # 各种路径
    paths:
      package: /opt/setup_cdh
    # 各种组件安装包
    packages:
      java: jdk-8u261-linux-x64.tar.gz
      scala: scala-2.13.0-M4.tgz
      mysql_driver: mysql-connector-java-5.1.47.jar

    # 各种链接
    url:
      cloudera_baseurl: https://archive.cloudera.com/cm6/6.3.1/redhat7/yum/
      cloudera_baseurl_local: "http://{{local_yum_repo}}/cloudera-repos/cm6/"
    password:
      scm: 123456

  remote_user: root

  tasks:
    # 1. 安装 yum 源文件
    - include: ./component/setup_local_yum.yml

    # 2.配置 mysql client
    - include: ./component/setup_mysql_client.yml

    # 3.配置 cloudera manager slave
    - include: ./component/setup_cloudera_manager_slave.yml
    # last:重启节点





# CDH 服务安装
- hosts: master_node
  # 开启debug
  gather_facts: F
  vars:
    # 各种路径
    paths:
      base_file: /opt/base_file
      package: /opt/setup_cdh
    # 各种密码，统一设置为 123456，方便测试和部署
    password:
      mysql: 123456
      # cloudera manager server
      scm: 123456
      # activity monitor
      amon: 123456
      # Reports Manager
      rman: 123456
      hive: 123456
      # sentry server
      sentry: 123456
      # cloudera navigator audit server
      nav: 123456
      # cloudera navigator metadata server
      navms: 123456
      oozie: 123456
      hue: 123456
  remote_user: root

  tasks:
    # 1.配置 mysql server（从本地 yum 源安装）
    - include: ./component/setup_mysql_server.yml

    # 2.配置 cloudera manager server
    - include: ./component/setup_cloudera_manager_master.yml
